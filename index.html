<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>rus tv</title>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.tgReady && tgReady()"></script>
<style>
  :root {
    --bg:#000; --row:#1c1c1e; --row-active:#2c2c2e; --sep:rgba(84,84,88,.45);
    --text:#fff; --muted:#8e8e93; --accent:#bf5af2; --ok:#30d158; --bad:#ff453a; --warn:#ff9f0a;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font:17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom); }

  /* Шапка: единственное фиолетовое место, как на аватарке */
  header { display:flex; justify-content:center; align-items:center; height:64px;
           background:radial-gradient(ellipse at 50% 60%, #4a0650 0%, #2a0034 55%, #0a0010 100%); }
  header img { height:30px; width:auto; display:block; }

  .player { position:sticky; top:0; z-index:5; background:#000; }
  video { width:100%; aspect-ratio:16/9; display:block; background:#000; }
  .now { display:flex; align-items:center; gap:8px; padding:10px 20px; min-height:42px;
         font-size:15px; color:var(--muted); border-bottom:.5px solid var(--sep); }
  .now b { color:var(--text); font-weight:600; }
  .live { font-size:11px; font-weight:700; letter-spacing:.04em; color:#fff; background:var(--bad);
          border-radius:4px; padding:2px 5px; display:none; }
  .now.on .live { display:inline-block; }

  h2 { margin:24px 20px 8px; font-size:13px; font-weight:400; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; }
  .list { margin:0 16px; border-radius:12px; overflow:hidden; background:var(--row); }
  .ch { display:flex; align-items:center; gap:12px; padding:10px 16px; position:relative; cursor:pointer; }
  .ch + .ch::before { content:""; position:absolute; top:0; left:72px; right:0; border-top:.5px solid var(--sep); }
  .ch:active, .ch.active { background:var(--row-active); }
  .badge { width:44px; height:44px; flex:none; border-radius:10px; display:grid; place-items:center;
           font-size:14px; font-weight:800; letter-spacing:-.02em; color:#fff; }
  .info { flex:1; min-width:0; }
  .name { font-size:17px; font-weight:500; }
  .sub { font-size:13px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ch.active .name { color:var(--accent); }
  .ch { flex-wrap:wrap; }
  .dots { display:flex; flex-wrap:wrap; gap:6px; width:100%; padding-left:56px; margin-top:-2px; }
  .dot { width:22px; height:22px; border-radius:11px; border:0; padding:0; font-size:11px; font-weight:600;
         color:var(--muted); background:rgba(120,120,128,.24); }
  .dot.ok { background:var(--ok); color:#002; }
  .dot.bad { background:var(--bad); color:#fff; }
  .dot.cur { box-shadow:0 0 0 2px var(--text); }
  .ch:not(.active) .dots { display:none; }

  footer { text-align:center; color:#48484a; font-size:12px; margin:24px 0 20px; }
</style>
</head>
<body>
<header><img src="logo.svg?v=2" alt="rus tv" width="80" height="30"></header>
<div class="player">
  <video id="v" controls playsinline autoplay referrerpolicy="no-referrer"></video>
  <div class="now" id="nowBox"><span class="live">LIVE</span><span id="now">Выбери канал</span></div>
</div>
<h2>Каналы</h2>
<div class="list" id="list"></div>
<footer>версия 8</footer>

<script>
const PROXY = "https://rustv.bvrhockey.workers.dev/?u=";
const viaProxy = (u) => PROXY + encodeURIComponent(u);

// Ссылки идут по порядку: сначала напрямую, потом те же через прокси (выручает, когда домашний интернет режет поток)
const CHANNELS = [
  { name: "Первый", short: "1", color: "#1c3f94", sources: [
    "https://streaming.thestream.cyou/live/210.m3u8",
    viaProxy("https://streaming.thestream.cyou/live/210.m3u8"),
    "https://serv30.vintera.tv/restream/1_old/playlist.m3u8",
    viaProxy("http://31.148.48.15/Pervii_kanal_HD/index.m3u8"),
    viaProxy("http://45.153.24.78/1TV/index.m3u8"),
    viaProxy("http://178.217.49.7/1/index.m3u8"),
    viaProxy("http://31.148.5.241/kanal_1/index.m3u8"),
  ]},
  { name: "Россия 1", short: "Р1", color: "linear-gradient(135deg,#d52b1e,#1a4fb4)", sources: [
    "https://stream.smotrim.ru/hls2/russia_hd/playlist_6.m3u8",
    "https://live.smotrim.ru/vgtrk/0/russia1-hd/index.m3u8",
    viaProxy("https://stream.smotrim.ru/hls2/russia_hd/playlist_6.m3u8"),
    viaProxy("https://live.smotrim.ru/vgtrk/0/russia1-hd/index.m3u8"),
    "https://vgtrkregion-reg.cdnvideo.ru/vgtrk/0/russia1-hd/index.m3u8",
    viaProxy("http://109.207.243.18/2/index.m3u8"),
  ]},
  { name: "НТВ", short: "НТВ", color: "#0b8f3c", sources: [
    "https://cdn-dvr.ntv.ru/ntv0_hd/index.m3u8",
    "https://cdn.ntv.ru/ntv0/index.m3u8",
    "https://bl.rutube.ru/livestream/c37cd74192c6bc3d6cd6077c0c4fd686/index.m3u8?e=2077050299&s=HSWg81JrQ3OqmwuWkEIDAQ&scheme=https",
    viaProxy("https://cdn-dvr.ntv.ru/ntv0_hd/index.m3u8"),
    "https://cdn.ntv.ru/ntv-msk_hd/index.m3u8",
  ]},
  { name: "СТС", short: "СТС", color: "#ff7a00", sources: [
    viaProxy("http://stream.mcquack.net/138/index.m3u8"),
    viaProxy("http://ott-cdn.ucom.am/s52/04.m3u8"),
    "https://streaming.televizor-24-tochka.ru/live/296.m3u8",
  ]},
  { name: "ТНТ", short: "ТНТ", color: "#7b2ff7", sources: [
    "https://bl.rutube.ru/livestream/546602986e6a424d74d594876ddb3f04/index.m3u8?s=K-z3nz49R1oGQ-5yPSd8pg&e=2082157024&scheme=https",
    "https://streaming.televizor-24-tochka.ru/live/38.m3u8",
    viaProxy("http://stream.mcquack.net/135/index.m3u8"),
  ]},
];

window.tgReady = () => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;
  try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0a0010'); tg.setBackgroundColor && tg.setBackgroundColor('#000000'); } catch (e) {}
};
if (window.Telegram) tgReady();

// Запоминаем, какая ссылка сработала в прошлый раз, и начинаем с неё
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const video = document.getElementById('v');
const now = document.getElementById('now');
const nowBox = document.getElementById('nowBox');
const list = document.getElementById('list');
const nativeHls = !!video.canPlayType('application/vnd.apple.mpegurl');
let hls = null, timer = null, watch = null, attempt = 0, current = -1;

// hls.js нужен только на Android/компьютере; на iPhone видео играет встроенный плеер, и библиотека не грузится
let hlsLib = null;
function loadHls() {
  if (window.Hls) return Promise.resolve();
  if (!hlsLib) hlsLib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.light.min.js';
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
  return hlsLib;
}

CHANNELS.forEach((ch, ci) => {
  const row = document.createElement('div');
  row.className = 'ch'; row.id = 'ch' + ci;
  row.innerHTML =
    '<div class="badge" style="background:' + ch.color + '">' + ch.short + '</div>' +
    '<div class="info"><div class="name">' + ch.name + '</div><div class="sub" id="sub' + ci + '">Прямой эфир</div></div>' +
    '<div class="dots"></div>';
  const dots = row.querySelector('.dots');
  ch.sources.forEach((u, si) => {
    const d = document.createElement('button');
    d.className = 'dot'; d.id = 'd' + ci + '_' + si; d.textContent = si + 1;
    d.onclick = (e) => { e.stopPropagation(); play(ci, si, false); };
    dots.appendChild(d);
  });
  row.onclick = () => {
    const saved = parseInt(store.get('src' + ci), 10);
    play(ci, Number.isInteger(saved) && saved < ch.sources.length ? saved : 0, true, 0);
  };
  list.appendChild(row);
});

function mark(ci, si, cls) {
  const d = document.getElementById('d' + ci + '_' + si);
  if (d) { d.classList.remove('ok', 'bad'); if (cls) d.classList.add(cls); }
}
function setStatus(html, live) { now.innerHTML = html; nowBox.classList.toggle('on', !!live); }

function stop() {
  clearTimeout(timer); clearInterval(watch);
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute('src'); video.load();
}

// tried — сколько ссылок уже перебрали, чтобы обойти круг один раз, начиная с запомненной
async function play(ci, si, autoNext, tried = 0) {
  const ch = CHANNELS[ci];
  if (tried >= ch.sources.length) {
    setStatus('<b>' + ch.name + '</b> · сейчас недоступен, попробуй позже');
    document.getElementById('sub' + ci).textContent = 'Недоступен';
    return;
  }
  si = si % ch.sources.length;
  const my = ++attempt;
  stop();
  if (current !== ci) {
    document.querySelectorAll('.ch').forEach(e => e.classList.remove('active'));
    document.getElementById('ch' + ci).classList.add('active');
    current = ci;
  }
  document.querySelectorAll('.dot').forEach(e => e.classList.remove('cur'));
  document.getElementById('d' + ci + '_' + si).classList.add('cur');
  setStatus('<b>' + ch.name + '</b> · подключаюсь…');
  document.getElementById('sub' + ci).textContent = 'Подключаюсь, источник ' + (si + 1);

  const url = ch.sources[si];
  let done = false, played = false, firstT = null, lastMove = Date.now();
  const next = () => { if (autoNext && my === attempt) play(ci, si + 1, true, tried + 1); };
  const fail = () => {
    if (done || my !== attempt) return; done = true;
    mark(ci, si, 'bad');
    document.getElementById('sub' + ci).textContent = 'Источник ' + (si + 1) + ' не отвечает';
    setTimeout(next, 300);
  };
  const ok = () => {
    if (done || my !== attempt) return; done = true; played = true;
    clearTimeout(timer);
    mark(ci, si, 'ok');
    store.set('src' + ci, si);
    setStatus('<b>' + ch.name + '</b>' + (video.muted ? ' · включи звук' : ''), true);
    document.getElementById('sub' + ci).textContent = 'Идёт · источник ' + (si + 1);
  };
  const start = () => video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });

  // Рабочим считаем источник, только когда видео реально пошло
  timer = setTimeout(fail, 15000);
  video.onerror = fail;
  video.ontimeupdate = () => {
    if (my !== attempt) return;
    if (firstT === null) firstT = video.currentTime;
    if (video.currentTime - firstT >= 1) ok();
    lastMove = Date.now();
  };
  // Сторож: если видео застыло на 15 сек не по твоей паузе — переключаемся на следующий источник
  watch = setInterval(() => {
    if (my !== attempt || !played || video.paused) { lastMove = Date.now(); return; }
    if (Date.now() - lastMove > 15000) {
      clearInterval(watch); mark(ci, si, 'bad');
      setStatus('<b>' + ch.name + '</b> · поток завис, переключаю…');
      play(ci, si + 1, true, tried + 1);
    }
  }, 3000);

  if (nativeHls) {
    video.src = url; start();
    return;
  }
  try { await loadHls(); } catch (e) { fail(); return; }
  if (my !== attempt) return;
  if (!window.Hls || !Hls.isSupported()) { fail(); return; }
  hls = new Hls({ manifestLoadingTimeOut: 10000, lowLatencyMode: false, backBufferLength: 30 });
  hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) fail(); });
  hls.on(Hls.Events.MANIFEST_PARSED, start);
  hls.loadSource(url);
  hls.attachMedia(video);
}
</script>
</body>
</html>
