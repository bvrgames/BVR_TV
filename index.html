window.tgReady = () => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;
  try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0a0010'); tg.setBackgroundColor && tg.setBackgroundColor('#000000'); } catch (e) {}
};
if (window.Telegram) tgReady();

// Запоминаем, какая ссылка сработала в прошлый раз, и начинаем с неё
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const video = document.getElementById('v');
const now = document.getElementById('now');
const nowBox = document.getElementById('nowBox');
const lists = document.getElementById('lists');
const sections = {};
const nativeHls = !!video.canPlayType('application/vnd.apple.mpegurl');
let hls = null, timer = null, watch = null, attempt = 0, current = -1;

// hls.js нужен только на Android/компьютере; на iPhone видео играет встроенный плеер, и библиотека не грузится
let hlsLib = null;
function loadHls() {
  if (window.Hls) return Promise.resolve();
  if (!hlsLib) hlsLib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.light.min.js';
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
  return hlsLib;
}

CHANNELS.forEach((ch, ci) => {
  const row = document.createElement('div');
  row.className = 'ch'; row.id = 'ch' + ci;
  row.innerHTML =
    '<div class="badge" style="background:' + ch.color + ';font-size:' + (ch.short.length > 5 ? 9 : ch.short.length > 3 ? 11 : 14) + 'px">' + ch.short + '</div>' +
    '<div class="info"><div class="name">' + ch.name + '</div><div class="sub" id="sub' + ci + '">Прямой эфир</div></div>' +
    '<div class="dots"></div>';
  const dots = row.querySelector('.dots');
  ch.sources.forEach((u, si) => {
    const d = document.createElement('button');
    d.className = 'dot'; d.id = 'd' + ci + '_' + si; d.textContent = si + 1;
    d.onclick = (e) => { e.stopPropagation(); play(ci, si, false); };
    dots.appendChild(d);
  });
  row.onclick = () => {
    const saved = parseInt(store.get('src' + ci), 10);
    play(ci, Number.isInteger(saved) && saved < ch.sources.length ? saved : 0, true, 0);
  };
  if (!sections[ch.sec]) {
    const wrap = document.createElement('div'); wrap.className = 'sec'; wrap.dataset.sec = ch.sec;
    const t = document.createElement('h2'); t.textContent = ch.sec; wrap.appendChild(t);
    const l = document.createElement('div'); l.className = 'list'; wrap.appendChild(l);
    lists.appendChild(wrap); sections[ch.sec] = l;
  }
  sections[ch.sec].appendChild(row);
});

// Меню разделов: кнопки над списком, выбранный раздел запоминается
const TAB_NAMES = { "Основные": "Основные", "Спорт": "Спорт", "Кино и сериалы": "Кино", "Развлечения и музыка": "Развлечения", "Детям": "Детям" };
const tabsBox = document.getElementById('tabs');
function showTab(sec) {
  document.querySelectorAll('.sec').forEach(w => { w.hidden = !(sec === 'Все' || w.dataset.sec === sec); });
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.sec === sec));
  store.set('tab', sec);
}
['Все', ...Object.keys(sections)].forEach(sec => {
  const b = document.createElement('button');
  b.className = 'tab'; b.dataset.sec = sec; b.textContent = TAB_NAMES[sec] || sec;
  b.onclick = () => { showTab(sec); window.scrollTo({ top: 0 }); };
  tabsBox.appendChild(b);
});
showTab(sections[store.get('tab')] || store.get('tab') === 'Все' ? store.get('tab') : 'Основные');

function mark(ci, si, cls) {
  const d = document.getElementById('d' + ci + '_' + si);
  if (d) { d.classList.remove('ok', 'bad'); if (cls) d.classList.add(cls); }
}
function setStatus(html, live) { now.innerHTML = html; nowBox.classList.toggle('on', !!live); }

function stop() {
  clearTimeout(timer); clearInterval(watch);
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute('src'); video.load();
}

// tried — сколько ссылок уже перебрали, чтобы обойти круг один раз, начиная с запомненной
async function play(ci, si, autoNext, tried = 0, retried = false) {
  const ch = CHANNELS[ci];
  if (tried >= ch.sources.length) {
    setStatus('<b>' + ch.name + '</b> · все источники сейчас не отвечают, попробуй позже');
    document.getElementById('sub' + ci).textContent = 'Недоступен';
    return;
  }
  si = si % ch.sources.length;
  const my = ++attempt;
  stop();
  if (current !== ci) {
    document.querySelectorAll('.ch').forEach(e => e.classList.remove('active'));
    document.getElementById('ch' + ci).classList.add('active');
    current = ci;
  }
  document.querySelectorAll('.dot').forEach(e => e.classList.remove('cur'));
  document.getElementById('d' + ci + '_' + si).classList.add('cur');
  setStatus('<b>' + ch.name + '</b> · подключаюсь к источнику ' + (si + 1) + ' из ' + ch.sources.length + '…');
  document.getElementById('sub' + ci).textContent = 'Подключаюсь, источник ' + (si + 1);

  const url = ch.sources[si];
  let done = false, played = false, firstT = null, lastMove = Date.now();
  const next = () => { if (autoNext && my === attempt) play(ci, si + 1, true, tried + 1); };
  const fail = () => {
    if (done || my !== attempt) return; done = true;
    mark(ci, si, 'bad');
    document.getElementById('sub' + ci).textContent = 'Источник ' + (si + 1) + ' не отвечает';
    if (autoNext && tried + 1 < ch.sources.length) setStatus('<b>' + ch.name + '</b> · источник ' + (si + 1) + ' не отвечает, пробую следующий…');
    else if (!autoNext) setStatus('<b>' + ch.name + '</b> · источник ' + (si + 1) + ' не отвечает');
    setTimeout(next, 300);
  };
  const ok = () => {
    if (done || my !== attempt) return; done = true; played = true;
    clearTimeout(timer);
    mark(ci, si, 'ok');
    store.set('src' + ci, si);
    setStatus('<b>' + ch.name + '</b> · идёт, источник ' + (si + 1) + (video.muted ? ' · включи звук' : ''), true);
    document.getElementById('sub' + ci).textContent = 'Идёт · источник ' + (si + 1);
  };
  const start = () => video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });

  // Рабочим считаем источник, только когда видео реально пошло
  // Потоки через прокси раскачиваются дольше, поэтому ждём их дольше.
  // Если картинка уже появилась, но видео не пошло — один раз перезапускаем этот же источник (обычно со второго раза идёт).
  timer = setTimeout(() => {
    if (my !== attempt || done) return;
    if (!retried && (video.readyState >= 2 || firstT !== null)) {
      setStatus('<b>' + ch.name + '</b> · источник ' + (si + 1) + ' медленный, перезапускаю…');
      play(ci, si, autoNext, tried, true);
    } else fail();
  }, url.startsWith(PROXY) ? 25000 : 15000);
  video.onerror = fail;
  video.ontimeupdate = () => {
    if (my !== attempt) return;
    if (firstT === null) firstT = video.currentTime;
    if (video.currentTime - firstT >= 1) ok();
    lastMove = Date.now();
  };
  // Сторож: если видео застыло на 15 сек не по твоей паузе — переключаемся на следующий источник
  watch = setInterval(() => {
    if (my !== attempt || !played || video.paused) { lastMove = Date.now(); return; }
    if (Date.now() - lastMove > 15000) {
      clearInterval(watch); mark(ci, si, 'bad');
      setStatus('<b>' + ch.name + '</b> · поток завис, переключаю…');
      play(ci, si + 1, true, tried + 1);
    }
  }, 3000);

  if (nativeHls) {
    video.src = url; start();
    return;
  }
  try { await loadHls(); } catch (e) { fail(); return; }
  if (my !== attempt) return;
  if (!window.Hls || !Hls.isSupported()) { fail(); return; }
  hls = new Hls({ manifestLoadingTimeOut: 10000, lowLatencyMode: false, backBufferLength: 30 });
  hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) fail(); });
  hls.on(Hls.Events.MANIFEST_PARSED, start);
  hls.loadSource(url);
  hls.attachMedia(video);
}
