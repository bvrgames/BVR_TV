<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rus tv</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root { --bg:#12001a; --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.10); --text:#fff; --muted:#b9a6c4; --accent:#437fd6; --red:#b72c2c; --ok:#2ecc71; --bad:#b72c2c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:#000; }
  body { margin:0; min-height:100vh; color:var(--text); font:15px/1.4 -apple-system,system-ui,sans-serif;
    background: radial-gradient(ellipse at 50% 40%, #4a0650 0%, #2a0034 45%, #0a0010 100%) fixed; }
  header { display:flex; align-items:center; justify-content:center; padding:14px 16px 10px; }
  header img { height:34px; width:auto; display:block; }
  .player { position:sticky; top:0; background:#000; z-index:2; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  video { width:100%; aspect-ratio:16/9; display:block; background:#000; }
  .now { padding:8px 16px; font-size:13px; color:var(--muted); background:#000; min-height:34px; }
  .now b { color:var(--text); }
  .list { padding:12px 16px 32px; display:grid; gap:10px; }
  .ch { background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:12px; }
  .ch.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .ch h3 { margin:0 0 8px; font-size:17px; }
  .src { display:flex; flex-wrap:wrap; gap:6px; }
  .src button { border:0; border-radius:9px; padding:7px 10px; font-size:13px; background:var(--card2); color:var(--text); }
  .src button.ok { background:var(--ok); color:#06210f; }
  .src button.bad { background:var(--bad); }
  .src button.playing { outline:2px solid #fff; }
  .hint { font-size:12px; color:var(--muted); padding:4px 16px 0; margin:0; }
</style>
</head>
<body>
<header><img src="logo.svg" alt="rus tv"></header>
<div class="player">
  <video id="v" controls playsinline autoplay referrerpolicy="no-referrer"></video>
  <div class="now" id="now">Выбери канал</div>
</div>
<p class="hint">Нажми на канал: он запустит первую ссылку, а если не пойдёт, сам попробует следующую. Зелёная кнопка — ссылка работает, красная — нет. <b>Версия 7</b></p>
<div class="list" id="list"></div>

<script>
const PROXY = "https://rustv.bvrhockey.workers.dev/?u=";
const viaProxy = (u) => PROXY + encodeURIComponent(u);

const CHANNELS = [
  { name: "Первый", sources: [
    "https://streaming.thestream.cyou/live/210.m3u8",
    "https://serv30.vintera.tv/restream/1_old/playlist.m3u8",
    viaProxy("http://31.148.48.15/Pervii_kanal_HD/index.m3u8"),
    viaProxy("http://45.153.24.78/1TV/index.m3u8"),
    viaProxy("http://178.217.49.7/1/index.m3u8"),
    viaProxy("http://31.148.5.241/kanal_1/index.m3u8"),
  ]},
  { name: "Россия 1", sources: [
    "https://stream.smotrim.ru/hls2/russia_hd/playlist_6.m3u8",
    "https://live.smotrim.ru/vgtrk/0/russia1-hd/index.m3u8",
    "https://vgtrkregion-reg.cdnvideo.ru/vgtrk/0/russia1-hd/index.m3u8",
    viaProxy("https://stream.smotrim.ru/hls2/russia_hd/playlist_6.m3u8"),
    viaProxy("http://109.207.243.18/2/index.m3u8"),
  ]},
  { name: "НТВ", sources: [
    "https://cdn-dvr.ntv.ru/ntv0_hd/index.m3u8",
    "https://cdn.ntv.ru/ntv0/index.m3u8",
    "https://bl.rutube.ru/livestream/c37cd74192c6bc3d6cd6077c0c4fd686/index.m3u8?e=2077050299&s=HSWg81JrQ3OqmwuWkEIDAQ&scheme=https",
    "https://cdn.ntv.ru/ntv-msk_hd/index.m3u8",
  ]},
  { name: "СТС", sources: [
    viaProxy("http://stream.mcquack.net/138/index.m3u8"),
    viaProxy("http://ott-cdn.ucom.am/s52/04.m3u8"),
    "https://streaming.televizor-24-tochka.ru/live/296.m3u8",
  ]},
  { name: "ТНТ", sources: [
    "https://bl.rutube.ru/livestream/546602986e6a424d74d594876ddb3f04/index.m3u8?s=K-z3nz49R1oGQ-5yPSd8pg&e=2082157024&scheme=https",
    "https://streaming.televizor-24-tochka.ru/live/38.m3u8",
    viaProxy("http://stream.mcquack.net/135/index.m3u8"),
  ]},
];

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

const video = document.getElementById('v');
const now = document.getElementById('now');
const list = document.getElementById('list');
const nativeHls = video.canPlayType('application/vnd.apple.mpegurl');
let hls = null, timer = null, watch = null, attempt = 0;

CHANNELS.forEach((ch, ci) => {
  const card = document.createElement('div');
  card.className = 'ch'; card.id = 'ch' + ci;
  card.innerHTML = '<h3>' + ch.name + '</h3><div class="src"></div>';
  const box = card.querySelector('.src');
  ch.sources.forEach((url, si) => {
    const b = document.createElement('button');
    b.textContent = 'Ссылка ' + (si + 1) + (url.startsWith('http:') ? ' (http)' : '');
    if (url.startsWith('http:')) b.classList.add('http');
    b.id = 'b' + ci + '_' + si;
    b.onclick = (e) => { e.stopPropagation(); play(ci, si, false); };
    box.appendChild(b);
  });
  card.onclick = () => play(ci, 0, true);
  list.appendChild(card);
});

function mark(ci, si, cls) {
  const b = document.getElementById('b' + ci + '_' + si);
  if (b) { b.classList.remove('ok', 'bad'); if (cls) b.classList.add(cls); }
}

function stop() {
  clearTimeout(timer); clearInterval(watch);
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute('src'); video.load();
}

function play(ci, si, autoNext) {
  const ch = CHANNELS[ci];
  if (si >= ch.sources.length) { now.innerHTML = '<b>' + ch.name + '</b>: ни одна ссылка не запустилась'; return; }
  const my = ++attempt;
  stop();
  document.querySelectorAll('.ch').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.src button').forEach(e => e.classList.remove('playing'));
  document.getElementById('ch' + ci).classList.add('active');
  document.getElementById('b' + ci + '_' + si).classList.add('playing');
  now.innerHTML = '<b>' + ch.name + '</b>: подключаюсь к ссылке ' + (si + 1) + '…';

  const url = ch.sources[si];
  let done = false, played = false;
  const fail = (why) => {
    if (done || my !== attempt) return; done = true;
    mark(ci, si, 'bad');
    now.innerHTML = '<b>' + ch.name + '</b>: ссылка ' + (si + 1) + ' не работает (' + why + ')';
    if (autoNext) setTimeout(() => { if (my === attempt) play(ci, si + 1, true); }, 600);
  };
  const ok = () => {
    if (done || my !== attempt) return; done = true;
    clearTimeout(timer); played = true;
    mark(ci, si, 'ok');
    now.innerHTML = '<b>' + ch.name + '</b>: идёт, ссылка ' + (si + 1) + (video.muted ? ' — включи звук в плеере' : '');
  };
  const start = () => video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
  // Канал считается рабочим, только когда видео реально идёт (время двигается), а не просто показан кадр
  let firstT = null;
  timer = setTimeout(() => fail('видео не пошло за 20 сек'), 20000);
  video.onplaying = null;
  video.onloadeddata = null;
  video.ontimeupdate = () => {
    if (my !== attempt) return;
    if (firstT === null) firstT = video.currentTime;
    if (video.currentTime - firstT >= 1) ok();
    lastMove = Date.now(); lastT = video.currentTime;
  };
  // Сторож: если уже шедшее видео застыло на 15 сек (а не стоит на паузе), переключаем на следующую ссылку
  let lastMove = Date.now(), lastT = -1;
  clearInterval(watch);
  watch = setInterval(() => {
    if (my !== attempt || !played || video.paused) { lastMove = Date.now(); return; }
    if (Date.now() - lastMove > 15000) {
      clearInterval(watch);
      mark(ci, si, 'bad');
      now.innerHTML = '<b>' + ch.name + '</b>: ссылка ' + (si + 1) + ' зависла, переключаю…';
      play(ci, si + 1, true);
    }
  }, 3000);
  video.onerror = () => fail('ошибка плеера');

  if (nativeHls) {
    video.src = url;
    start();
  } else if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ manifestLoadingTimeOut: 10000 });
    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) fail(d.details || 'ошибка'); });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => start());
  } else {
    fail('браузер не поддерживает');
  }
}
</script>
</body>
</html>
