# Автоматически выкладывает прокси (worker.js) в Cloudflare при каждом изменении
name: Выложить прокси в Cloudflare

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить секреты
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=1
          [ -z "$CLOUDFLARE_API_TOKEN" ] && echo "::error::Нет секрета CLOUDFLARE_API_TOKEN" && ok=0
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && echo "::error::Нет секрета CLOUDFLARE_ACCOUNT_ID" && ok=0
          [ "$ok" = 1 ] && echo "::notice::Оба секрета на месте (длина токена ${#CLOUDFLARE_API_TOKEN}, ID ${#CLOUDFLARE_ACCOUNT_ID})"
          [ "$ok" = 1 ]
      - name: Выложить
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if npx --yes wrangler@4 deploy 2>&1 | tee out.txt; then
            echo "::notice::Прокси выложен: $(grep -o 'https://[^ ]*workers.dev' out.txt | head -1)"
          else
            msg=$(grep -E 'ERROR|error|✘|Authentication|permission' out.txt | head -5 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error::Wrangler: ${msg:-$(tail -3 out.txt | tr '\n' ' ')}"
            exit 1
          fi
      - name: Подключить бота (приветствие на /start)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::warning::Нет секрета TELEGRAM_BOT_TOKEN — приветствие бота не подключено"; exit 0; fi
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4 secret put TELEGRAM_BOT_TOKEN >/dev/null
          SECRET=$(printf 'rustv:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-32)
          RES=$(curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://rustv.bvrhockey.workers.dev/tg" \
            --data-urlencode "secret_token=${SECRET}" \
            --data-urlencode 'allowed_updates=["message"]')
          if echo "$RES" | grep -q '"ok":true'; then echo "::notice::Бот подключён: приветствие на /start работает"
          else echo "::error::Telegram ответил: $(echo "$RES" | sed 's/%/%25/g')"; exit 1; fi
