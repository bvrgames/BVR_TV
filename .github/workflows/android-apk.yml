# Собирает APK для Android TV и выкладывает его по постоянной ссылке:
# https://github.com/bvrgames/BVR_TV/releases/download/tv/rus-tv.apk
name: Собрать APK для ТВ

on:
  push:
    branches: [main]
    paths:
      - android/**
      - tv/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Ключ подписи нужен постоянный, иначе новая версия не встанет поверх старой.
      # Он хранится в репозитории зашифрованным; пароль выводится из секрета TELEGRAM_BOT_TOKEN и наружу не попадает.
      - name: Ключ подписи
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TG" ]; then echo "::error::Нет секрета TELEGRAM_BOT_TOKEN"; exit 1; fi
          P=$(printf 'rustv-apk:%s' "$TG" | sha256sum | cut -c1-40)
          echo "::add-mask::$P"
          KS="$RUNNER_TEMP/rustv.jks"
          echo "KS_PASS=$P" >> "$GITHUB_ENV"
          echo "KS_FILE=$KS" >> "$GITHUB_ENV"
          ENC=android/signing/rustv.jks.enc
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$ENC" -out "$KS" -pass "pass:$P"
            echo "::notice::Ключ подписи на месте"
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias rustv -keyalg RSA -keysize 2048 \
              -validity 20000 -storepass "$P" -keypass "$P" -dname "CN=rus tv, O=BVR" >/dev/null
            mkdir -p android/signing
            openssl enc -e -aes-256-cbc -pbkdf2 -iter 200000 -in "$KS" -out "$ENC" -pass "pass:$P"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"
            git commit -q -m "Ключ подписи APK (зашифрован)"
            git pull -q --rebase origin main && git push -q origin HEAD:main
            echo "::notice::Создан новый ключ подписи"
          fi

      - name: Собрать
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/rus-tv.apk"
          ls -la "$RUNNER_TEMP/rus-tv.apk"

      - name: Выложить
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cd "$RUNNER_TEMP"
          NOTES="Приложение rus tv для Android TV, версия 1.$N. Скачай rus-tv.apk и установи на телевизор."
          if gh release view tv -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload tv rus-tv.apk --clobber -R "$GITHUB_REPOSITORY"
            gh release edit tv --title "rus tv для ТВ — версия 1.$N" --notes "$NOTES" -R "$GITHUB_REPOSITORY"
          else
            gh release create tv rus-tv.apk --title "rus tv для ТВ — версия 1.$N" --notes "$NOTES" --latest -R "$GITHUB_REPOSITORY"
          fi
          echo "::notice::APK: https://github.com/$GITHUB_REPOSITORY/releases/download/tv/rus-tv.apk"

      # Лог сборки (и сам APK) — в отдельную ветку ci-logs, чтобы их можно было проверить без доступа к Actions
      - name: Отчёт о сборке
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/report" && cd "$RUNNER_TEMP/report"
          [ -f ../build.log ] && tail -c 400000 ../build.log > build.log || echo "сборка не дошла до gradle" > build.log
          [ -f ../rus-tv.apk ] && cp ../rus-tv.apk . && sha256sum rus-tv.apk > rus-tv.apk.sha256
          echo "run=${{ github.run_number }} status=${{ job.status }} commit=${{ github.sha }}" > status.txt
          git init -q && git checkout -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Сборка ${{ github.run_number }}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs
